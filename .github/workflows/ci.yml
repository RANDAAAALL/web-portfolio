name: Portfolio CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / build / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pinned deliberately. `ubuntu-latest` migrates to Ubuntu 26.04 in November
    # 2026; pinning keeps the runner image deterministic so a native module
    # (sharp, @next/swc) can never break the build from an OS change.
    # Bump this to `ubuntu-26.04` when 24.04 is announced as deprecated.

    env:
      # PLACEHOLDERS ONLY -- never real secrets.
      #
      # These are fake values, not credentials. A workflow file is committed
      # to git and visible to everyone with repo access, so real keys must
      # never live here.
      #
      # The build does not actually need them. `next build` evaluates route
      # modules to collect page data, but:
      #   - the Resend client is constructed lazily inside the request handler,
      #     so `new Resend()` is never called at build time
      #   - `new Redis({url, token})` only logs a warning when the values are
      #     missing; it does not throw
      # Verified: the build completes with no env vars and no .env at all.
      #
      # They are here to silence the two Upstash "property is missing"
      # warnings in the build log and to document which env vars the app
      # expects. Nothing in CI contacts Resend or Upstash over the network.
      #
      # If a future job DOES need real credentials, put them in GitHub
      # Actions Secrets and reference them as `${{ secrets.RESEND_API_KEY }}`
      # -- never inline them here.
      RESEND_API_KEY: re_ci_placeholder
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node (version pinned by .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # NOTE: `cache: npm` is intentionally not set. This project installs
          # with Bun, and setup-node's npm cache requires a package-lock.json,
          # which does not exist here.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # TEMPORARY CANARY - removed in the follow-up commit
      - name: "[canary] intentionally fail to test the deployment gate"
        run: exit 1

      # Hard gate.      #
      # GHSA-vfj7-8cjw-p6xm (braces, stack exhaustion via deeply nested glob
      # patterns) has NO upstream patch -- 3.0.3 is the latest published
      # release -- and every glob pattern in this project is a static
      # build-time constant, so it is not reachable from attacker input.
      - name: Security audit (blocking gate)
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      # Full report for visibility; never blocks the pipeline.
      - name: Security audit (full report)
        if: always()
        run: bun audit || true
