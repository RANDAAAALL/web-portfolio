name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / build / audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # PLACEHOLDERS ONLY -- never real secrets.
      #
      # The Resend client is constructed lazily inside the route handler, so
      # `next build` does not need a real key. A non-empty placeholder is
      # still provided so any accidental eager use fails loudly instead of
      # silently. Redis is only contacted at request time.
      RESEND_API_KEY: re_ci_placeholder
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (version pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # NOTE: `cache: npm` is intentionally not set. This project installs
          # with Bun, and setup-node's npm cache requires a package-lock.json,
          # which does not exist here.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Hard gate.
      #
      # GHSA-vfj7-8cjw-p6xm (braces, stack exhaustion via deeply nested glob
      # patterns) has NO upstream patch -- 3.0.3 is the latest published
      # release -- and every glob pattern in this project is a static
      # build-time constant, so it is not reachable from attacker input.
      - name: Security audit (blocking gate)
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      # Full report for visibility; never blocks the pipeline.
      - name: Security audit (full report)
        if: always()
        run: bun audit || true
